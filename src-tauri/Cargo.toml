[package]
name = "markdown-document-app"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "markdown_document_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-single-instance = "2"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Registry"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"
