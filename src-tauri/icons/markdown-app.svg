<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc" data-icon-role="markdown-app">
  <title id="title">Markdown 文档</title>
  <desc id="desc">A transparent folded Markdown document with an editing pencil</desc>
  <defs>
    <linearGradient id="app-paper" x1="43" y1="11" x2="205" y2="247" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFEFA"/>
      <stop offset=".62" stop-color="#F6F7F4"/>
      <stop offset="1" stop-color="#E7ECEE"/>
    </linearGradient>
    <linearGradient id="app-fold" x1="148" y1="11" x2="213" y2="77" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EDF2F3"/>
      <stop offset="1" stop-color="#D3DDE1"/>
    </linearGradient>
    <linearGradient id="app-pencil" x1="135" y1="193" x2="218" y2="122" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5A24F"/>
      <stop offset="1" stop-color="#EF8737"/>
    </linearGradient>
    <filter id="app-shadow" x="-16%" y="-12%" width="132%" height="136%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#12202A" flood-opacity=".22"/>
    </filter>
  </defs>
