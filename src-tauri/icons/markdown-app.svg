    <path data-icon-part="paper" d="M43 11h105l65 65v149c0 12-10 22-22 22H43c-12 0-22-10-22-22V33c0-12 10-22 22-22Z" fill="url(#app-paper)" stroke="#9EACB3" stroke-width="4" stroke-linejoin="round"/>
    <path d="M148 11v45c0 12 9 21 21 21h44" fill="url(#app-fold)" stroke="#9EACB3" stroke-width="4" stroke-linejoin="round"/>
    <g data-icon-part="markdown-mark" fill="#22323D">
      <path d="M45 159V99h15l18 23 18-23h14v60H94v-34l-16 20-17-20v34H45Z"/>
      <path fill-rule="evenodd" d="M116 99h21c22 0 36 11 36 30s-14 30-36 30h-21V99Zm16 15v30h6c11 0 18-5 18-15s-7-15-18-15h-6Z"/>
    </g>
    <path d="M51 178h74M51 198h57" stroke="#B8C3C7" stroke-width="7" stroke-linecap="round"/>
    <g data-icon-part="editing-pencil">
      <path d="m135 193 17 17 66-67-17-17-66 67Z" fill="url(#app-pencil)"/>
      <path d="m135 193-7 25 24-8Z" fill="#F0C08C"/>
      <path d="m128 218 12-4-8-8-4 12Z" fill="#34434C"/>
      <path d="m196 131 17 17 8-9c4-4 4-10 0-14l-3-3c-4-4-10-4-14 0l-8 9Z" fill="#394851"/>
      <path d="m152 207 66-67" stroke="#FFD0A3" stroke-width="3" stroke-linecap="round" opacity=".72"/>
